name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "22.22.2"
          cache: true

      - run: vp install

      - name: CI gate (Vite+ task runner)
        run: vp run gate

      - name: Storybook build
        run: vp run build-storybook
